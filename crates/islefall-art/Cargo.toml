[package]
name = "islefall-art"
description = "Generated art for Islefall: pictures made from a seed instead of read from the original game"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
noise = "0.9"
png = "0.18"
clap = { version = "4.6.6", features = ["derive"] }

[[bin]]
name = "artgen"
path = "src/bin/artgen.rs"

[package]
name = "islefall"
description = "Islefall, a sky-islands real-time strategy game"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
islefall-data = { workspace = true, features = ["png"] }
islefall-sim = { workspace = true }
islefall-net = { path = "../islefall-net" }
noise = "0.9"
thiserror = "2.0.20"
rand = "0.10.2"
rand_pcg = "0.10.2"
etagere = "0.3.0"

[dependencies.bevy]
version = "0.19.1"
default-features = false
# 2D only plus audio (WAV) and UI text: no PBR, glTF or gamepad backend until needed.
features = ["2d", "wayland", "x11", "bevy_audio", "wav", "bevy_ui", "bevy_ui_render", "bevy_text", "default_font"]

[features]
default = []
# Faster incremental dev builds: `cargo run --features dynamic_linking`.
dynamic_linking = ["bevy/dynamic_linking"]

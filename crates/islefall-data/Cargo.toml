[package]
name = "islefall-data"
description = "Loaders for the original NetStorm data files (sprite cache, palettes)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
gif = "0.13"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.20"
toml = "1"

[dev-dependencies]

[[bin]]
name = "shpdump"
path = "src/bin/shpdump.rs"
required-features = ["png"]

[[bin]]
name = "tarcdump"
path = "src/bin/tarcdump.rs"

[[bin]]
name = "fortdump"
path = "src/bin/fortdump.rs"

[features]
default = ["png"]
png = ["dep:png"]

[dependencies.png]
version = "0.17"
optional = true

[package]
name = "islefall-sim"
description = "Deterministic game simulation for Islefall: grid, islands, units"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
islefall-data = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "1"
postcard = { version = "1", features = ["use-std"] }
rhai = { version = "1.26", features = ["sync", "no_time", "only_i64"] }

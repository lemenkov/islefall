# The demo scene: a home island with the altar, Temple, a Sun Workshop and
# a Disc Thrower, a bridge to a battery islet, a neutral geyser island, and
# an enemy island with a geyser, a shooter, a Whirlibase, a priest, a
# Temple and a golem.
#
# Cells are (x, y) with y growing downwards. Structure and unit positions
# are hotspot cells (the bottom-right cell of a footprint). Islands are
# rectangles with optional cells removed.

name = "Demo"
# Storm Power every player starts with once the layout stands.
start_power = 1500
# Camera centre cell, unless ISLEFALL_CAMERA overrides it.
camera = [11, 5]

[[islands]]
owner = 0
theme = "sun"
origin = [0, 0]
size = [24, 12]
remove = [[23, 0], [22, 0], [23, 1]]

[[islands]]
owner = 1
theme = "sun"
origin = [36, 4]
size = [16, 11]

# A neutral island with a geyser: anyone may build on it, nobody may bridge
# off it until an Outpost claims it.
[[islands]]
theme = "sun"
origin = [25, 8]
size = [7, 5]

# Bridge cells laid by the map; connections and tiles follow from adjacency.
[[bridges]]
owner = 0
cells = [[24, 4], [25, 4], [26, 4], [27, 4], [28, 4], [28, 3], [28, 2], [26, 3], [26, 5], [26, 6], [29, 3], [27, 2], [25, 5], [27, 3]]


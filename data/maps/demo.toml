# The demo scene: every faction on show. A Sun home island with the altar,
# Temple, Workshop, Disc Thrower, Cannon and Stone Tower, a bridge to a
# battery islet, a neutral geyser island, a Wind enemy island to the east,
# and Rain and Thunder islands to the south, each with its Workshop,
# Temple, shooters, Generator, tower, barricade, air base, walker and
# priest.
#
# Cells are (x, y) with y growing downwards. Structure and unit positions
# are hotspot cells (the bottom-right cell of a footprint). Islands are
# rectangles with optional cells removed.

name = "Demo"
# Storm Power every player starts with once the layout stands.
start_power = 1500
# Camera centre cell, unless ISLEFALL_CAMERA overrides it.
camera = [11, 5]

[[islands]]
owner = 0
theme = "sun"
origin = [0, 0]
size = [24, 12]
remove = [[23, 0], [22, 0], [23, 1]]

# The enemy is the Wind faction: its own island ground, Workshop, Crossbows,
# Generators and Devil Maker.
[[islands]]
owner = 1
theme = "wind"
origin = [36, 4]
size = [16, 11]

# A neutral island with a geyser: anyone may build on it, nobody may bridge
# off it until an Outpost claims it.
[[islands]]
theme = "sun"
origin = [25, 8]
size = [7, 5]

# The Rain faction, south-west: icy ground, Ice Cannon and Ice Tower. The
# islands are close: the cannons reach the neighbours (the Thunder Cannon
# 44 cells, the Ice Cannon 32, yours 22 along its row and column), so the
# fight is on from the start.
[[islands]]
owner = 2
theme = "rain"
origin = [0, 20]
size = [28, 13]

# The Thunder faction, south-east: Thunder Cannon, Vander Tower and Bulwark.
[[islands]]
owner = 3
theme = "thunder"
origin = [34, 22]
size = [28, 13]


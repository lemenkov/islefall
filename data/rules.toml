# Islefall game rules and parameters.
#
# Everything the simulation treats as a number or a name lives here; the
# code holds no defaults. Values were chosen to match NetStorm's manual where
# it gives figures and are marked "guess" where it does not. Formulas and
# decisions live in scripts/rules.rhai.

[sim]
# Simulation ticks per second. Rendering samples; the simulation never sees wall-clock time.
tick_hz = 30
# Players the world keeps reserves and Knowledge for.
max_players = 8

[grid]
# Cell size in source pixels (NetStorm's map is a plain 16 x 11 grid).
cell_w = 16
cell_h = 11

[walking]
# Path cost multiplier for cells units avoid (`yuckWalk`).
avoid_cost = 5
# Fixed-point steps per cell for unit positions.
subcell = 256
# Nothing walks over a building or stands on one: every structure's
# footprint is impassable unless its type carries a `walk_free` flag. With
# this off, only `walk_blocked` types block and `walk_avoid` ones cost.
structures_block = true
# A unit standing still blocks its cell: a walker that runs into one waits
# `wait_seconds`, then finds a way round. Units on the move pass each
# other, so two walkers meeting on a one-cell bridge never jam.
units_block = true
wait_seconds = 1.0

# Which type flags mean what. Flag names are matched case-insensitively.
[flags]
walk_blocked = ["walkBlocking"]
walk_avoid = ["yuckWalk"]
# Types units may cross even though they are structures (none in the data).
walk_free = []
drop_blocking = ["dropBlocking"]
creates_island = ["createsisland"]
may_drop_on_rim = ["mayDropOnRim"]
unit = ["walker", "flyer", "balloon"]
# Aerial attackers, launched by a base and never a Transport.
flyer = ["flyer"]
# Aerial Transports: fly anywhere, harvest and capture.
balloon = ["balloon"]
priest = ["priest"]
geyser = ["geyser"]
temple = ["residence", "vortex"]
altar = ["dais"]
workshop = ["factory"]
# Obelisks hold a Spell; `bomb` types are the Spells themselves.
obelisk = ["buried"]
spell = ["bomb"]
# Type classes (the `class` property) that produce Energy of their theme.
energy_source_classes = ["Source of Energy"]

[production]
# Production slots per Workshop level (the manual: two, three and four for
# Levels One to Three); a Workshop may be upgraded once per further entry.
workshop_slots = [2, 3, 4]
# An upgrade costs this share of the Workshop's own price (guess).
upgrade_cost_percent = 100
# Types any Temple provides without a Workshop (the manual: bridges and Golems).
temple_types = ["sunwalker"]
# Outposts: claim a neutral island, ward it, and take in Storm Crystals.
outpost_types = ["outpost"]

[air]
# Type classes of structures that launch an aerial attacker.
base_classes = ["Air Attack Base"]
# The attacker each base launches; nothing in the data names it.
launches = { sunaviary = "sunflyer", windaviary = "windflyer", rainaviary = "rainflyer" }
# Seconds a base waits after losing its attacker before launching another
# (manual: the Devil Maker regenerates one every twenty seconds).
respawn_seconds = 20.0
# Cells within which an aerial attacker strikes (guess); each strike is one
# shot of its `hpPerSec` x `delayBetweenShots`.
strike_range = 1
# Seconds an attacker flies before it must refuel or fall (manual: Whirligig
# once a minute, Dust Devil ten seconds, Man o'War one minute).
[air.attackers]
sunflyer = { life_seconds = 60.0, refuels = true, hunts_transports = false, cracks_bridges = false, kill_extends_life = false }
windflyer = { life_seconds = 10.0, refuels = false, hunts_transports = true, cracks_bridges = true, kill_extends_life = false }
rainflyer = { life_seconds = 60.0, refuels = false, hunts_transports = true, cracks_bridges = false, kill_extends_life = true }

# Spells: a Transport reads an Obelisk to learn the Spell it holds, keeps it
# for life, and casts it around itself for the Spell's `cost`, halting for
# its `casttime`. A High Priest may pray `praytime` seconds for `prayer`.
# Obelisks a map leaves blank draw from `pool` (weights) with `seed`.
[spells]
default_cast_seconds = 2.0
prayer = "bombspecialone"
seed = 7
pool = { bombexplodesmall = 3, bombexplodemedium = 2, bombheal = 2, bombhardener = 2, bombparalyze = 1, bombinvisible = 1, bombtreason = 1, bombexplodelarge = 1 }

# What each Spell does within its `range` (cells around the caster, never
# the caster): damage deals `amount` hit points to everything; heal brings
# the caster's own to full and lifts paralysis and invisibility; harden
# makes bridges indestructible; paralyse stops movement, shooting and
# casting for the Spell's `effecttime`; invisible hides the caster's own
# units for it; treason hands every unit but a High Priest to the caster.
# The damage figures are guesses; the manual gives none. Summons and the
# Thunder, Bombardment and Graviton Spells are not modelled.
[spells.effects]
bombexplodesmall = { kind = "damage", amount = 150 }
bombexplodemedium = { kind = "damage", amount = 250 }
bombspecialone = { kind = "damage", amount = 250 }
bombexplodelarge = { kind = "damage", amount = 400 }
bombheal = { kind = "heal" }
bombhardener = { kind = "harden" }
bombparalyze = { kind = "paralyse" }
bombinvisible = { kind = "invisible" }
bombtreason = { kind = "treason" }

[bridges]
# Seconds an unsupported bridge cell stays cracked before it crumbles.
crumble_seconds = 4.0
# Pieces on offer in the Production window (the game allows 2, 4 or 6).
piece_slots = 4
# Seed of the player's piece queue.
queue_seed = 24301
# The piece catalogue: cell offsets from the origin. The real catalogue is
# not in the data; this is a plausible set.
pieces = [
    { name = "one", cells = [[0, 0]] },
    { name = "two", cells = [[0, 0], [1, 0]] },
    { name = "three", cells = [[0, 0], [1, 0], [2, 0]] },
    { name = "corner", cells = [[0, 0], [1, 0], [1, 1]] },
    { name = "tee", cells = [[0, 0], [1, 0], [2, 0], [1, 1]] },
    { name = "zig", cells = [[0, 0], [1, 0], [1, 1], [2, 1]] },
    { name = "four", cells = [[0, 0], [1, 0], [2, 0], [3, 0]] },
    { name = "cross", cells = [[1, 0], [0, 1], [1, 1], [2, 1], [1, 2]] },
]

[economy]
# Storm Power carried per trip: the `cost` of a Storm Crystal (`nugget`).
nugget_power = 200
# Seconds a unit spends taking a crystal or handing it in.
work_seconds = 1.0
# Share of the cost refunded when a healthy structure is salvaged (manual: 25%).
salvage_refund_percent = 25
# Share of an enemy's cost awarded to whoever destroys it (manual: 25%).
kill_reward_percent = 25
# Type whose `cost` is a geyser's crystal stock; geysers themselves are free.
geyser_stock_from_cost = true

# Once placed in play, a structure is built by a stream of Storm Power from
# an own Temple, Workshop or Outpost reached over connected ground; until
# the stream arrives it stands as a shell and does nothing. Build time is
# `construction_seconds` in scripts/rules.rhai from the type's cost and
# `constructionRate`, scaled by this many Power per second per rate unit
# (guess: a 400-cost Sun Cannon at rate 10 stands in 8 seconds).
[construction]
power_per_rate = 5.0

[combat]
# Cells around an exploding structure that take damage and bridge shock (guess).
explosion_radius = 2
# Damage an explosion deals to everything within the radius (guess).
explosion_damage = 150
# Seconds between shots when a type has no `delayBetweenShots`, as handed
# to the `shot_delay` hook (which gives cannons five seconds).
default_delay_between_shots = 1.0

[priest]
# Cells from an own Temple within which a priest regenerates (guess).
temple_heal_range = 8
# Hit points a priest regenerates per second near his Temple (guess).
heal_per_second = 2

[energy]
# Radius of an Energy source's circle, in source pixels (guess; the manual only says fixed).
range_px = 128
# The reach is shown as stars drifting round it, this many, one turn in so many seconds.
stars = 12
star_seconds = 9.0
# The original's twinkling range stars, coloured by the source's theme.
star_type = "range"
star_labels = { sun = "A", thunder = "B", rain = "C", wind = "G" }

[ai]
# Seconds between opponent moves.
move_seconds = 4.0
# Every this many moves the opponent drops a shooter instead of a piece.
shooter_every = 3
# What the opponent drops, and what it drops instead when the shooter's
# site lacks Energy; it puts both into production at its Workshop.
shooter = "sunarcher"
generator = "sunbattery"
# How far from an open end a shooter's hotspot may be tried.
shooter_reach = 3
# Seed of the opponent's piece queue.
queue_seed = 161

# The sky is generated, not drawn: `background` is the colour behind
# everything, and each layer is a tile of fractal noise sampled on a torus
# (so it wraps without a seam) from `seed`, `scale` (cloud size across the
# tile: higher is smaller clouds), `octaves` (detail), `gain` and
# `lacunarity` (how each octave weakens and tightens), then cut at `cover`
# (0 to 1: how much of the tile is cloud) with `softness` at the edges,
# coloured `tint` and drawn at `opacity`. Speed is source pixels per
# second along x and y; layers are drawn bottom first and laid out
# `extent_tiles` tiles wide around the camera.
[sky]
background = [0.16, 0.19, 0.33]
extent_tiles = 16
layers = [
    { seed = 11, tile = 512, scale = 3.0, octaves = 5, gain = 0.5, lacunarity = 2.0, cover = 0.42, softness = 0.30, tint = [0.55, 0.62, 0.85], opacity = 0.9, speed = [6.0, 2.0] },
    { seed = 23, tile = 512, scale = 2.0, octaves = 4, gain = 0.55, lacunarity = 2.1, cover = 0.55, softness = 0.25, tint = [0.82, 0.86, 1.0], opacity = 0.75, speed = [-3.0, 4.0] },
]

# A mod's own sprites: `<dir>/<stem>.toml` next to its picture replaces a
# type's sprites from the installation. `shpdump export` writes the
# originals in that form to start from.
[sprites]
dir = "sprites"

# What hangs under islands, as in the original: `fringe` stalactites under
# the rim cells of big islands (by the `isle` piece label: EI is the bottom
# edge, IO and HN the bottom corners, AB and AE the inside bottom
# corners), their hotspots `hang` cells below the rim so the picture
# starts at the rim's top; and one `islandstalag` rock under a
# three-by-three island (frame 8 is the one without a player's apron).
[fringe]
kind = "fringe"
pieces = { EI = "EA", IO = "IA", HN = "HA", AB = "AB", AE = "AE" }
hang = 3
stalag = "islandstalag"
stalag_frame = 8

# The text in the corner of the screen. Placeholders: {power}, {knowledge},
# {techs}, {tool}, {status} (the last thing the game had to say) and
# {opponents} (players still in). The last two lines show when the game
# is decided.
[hud]
font_size = 14.0
lines = [
    "Storm Power {power}   Knowledge {knowledge} ({techs} techs)",
    "Tool: {tool}   Opponents standing: {opponents}",
    "{status}",
]
victory = "Victory! The enemy High Priests have been sacrificed."
defeat = "Defeat. Your High Priest was sacrificed."
# The selected unit: a pulsing ring on the ground round its feet.
selection_colour = [1.0, 0.9, 0.2]
selection_ring = [22.0, 11.0]
selection_pulse = 1.5
# A harvesting Golem is seen carrying a Storm Crystal (the `nugget` type's
# frames, cycled) this many source pixels above its feet, at this scale of
# the crystal lying on the ground.
carried_crystal = "nugget"
carried_lift = 12.0
carried_scale = 0.5

# How a structure's frames animate. Frames labelled `idle_label` (or the
# label of the structure's level) loop: geysers spout, batteries turn,
# window lights flicker over a Temple or Workshop; a type flagged
# `variant_flag` shows one frame of its default's group, chosen per cell
# unless the map pins one with `frame` (trees differ: bushes, dead trees,
# rocks, tall clumps; a Temple has three layouts). `tag_flags` mark a
# frame's role, not its look, and are ignored when grouping.
[animation]
idle_label = "A"
# A Workshop's `A`, `B` and `C` frames are its Levels One to Three.
levels = ["A", "B", "C"]
# Within a label, frames smaller than this share of the biggest one are
# overlays drawn on top of it (window lights), not pictures of their own.
overlay_share = 0.6
tag_flags = ["default", "baseframe", "help", "gumpframe"]
# Frames with these flags are pictures for menus and help, never the map.
hidden_flags = ["help", "gumpframe"]
variant_flag = "randframe"
# Small frames of this label are a shooter's firing animation, played once
# over its picture per shot: the Disc Thrower's arm spinning a throw.
fire_label = "P"
# Cannons aim only along the axes: the label of each direction is its
# firing animation, played once per shot, and the direction's first frame
# is how it rests afterwards (the Ice Cannon keeps its gun out, the
# Thunder Cannon keeps facing its target). A type with whole pictures of
# the fire label between the direction groups is an all-round turret: the
# pictures are the bearings in between, and the turret swings along that
# ring to each new target, a quarter turn in `turn_seconds`, and stays
# there (the Crossbow's hundred frames).
cardinal = { north = "L", east = "M", south = "N", west = "O" }
turn_seconds = 0.5
# Types whose idle frames are several runs from full to empty, shown by the
# share of stock left: a geyser's spout is tall, then half, then low.
stages = { geyser = 3 }
# A Temple's `A` frames repeat its layouts on the other islands' grounds,
# in this order of themes; its default `P` frames are the Sun's green.
ground_label = "A"
ground_order = ["thunder", "wind", "rain"]
# The Sun Cannon's frames are not in play order: it rests with the barrel
# up (its default, frame 16), lowers it towards the target, fires from the
# lowered pose and raises it again. Frame indices are the file order that
# `shpdump export` lists.
[animation.fire_sequences.suncannon]
north = [16, 9, 10, 11, 1, 11, 10, 9, 16]
east = [16, 17, 18, 19, 3, 19, 18, 17, 16]
south = [16, 7, 6, 5, 4, 0, 4, 5, 6, 7, 16]
west = [16, 15, 14, 13, 12, 2, 12, 13, 14, 15, 16]

# What flies when a shooter fires: the missile type by shooter (the data
# never links them; the sun disc, the crossbow bolt and the two cannons'
# shells), the missile of any other shooter, the flight speed and the
# height of the lob, and whether a missile with many frames turns to its
# bearing (the bolt's 20) rather than spinning through them.
[projectiles]
types = { sunarcher = "sundisc", windarcher = "bolt", thundercannon = "thundercannonmissile", raincannon = "raincannonmissile" }
default = "blankmissile"
speed_px = 260.0
arc_px = 14.0
bearing_min_frames = 16
# The Thunder Cannon's bolt has four runs of three frames, one per
# direction in this order; the run of the flight's direction loops.
cardinal_frames = { thundercannonmissile = 3 }
cardinal_order = ["north", "east", "south", "west"]
flash_seconds = 0.3

# Fire and smoke on a damaged structure, generated as the original's
# particle system did: flames start once health falls below
# `burning_below`, more below `blazing_below`, rise and fade.
# The `anim` container holds the original's explosions: `A` a great
# fireball, `B` a white blast, `C` a short bang, `D` a small puff; `flare`
# holds sparkles. A missile's landing shows `impact`, a structure's end
# `destroyed`, and a structure under construction sparkles with `building`.
[effects]
fps = 20.0
impact = { type = "anim", label = "D" }
destroyed = { type = "anim", label = "A" }
building = { type = "flare", label = "A" }
sparkles_per_cell = 0.6
burning_below = 0.5
blazing_below = 0.25
flames_per_cell = 1.5
blaze_per_cell = 4.0
flame_seconds = 0.5
flame_rise_px = 18.0
smoke_per_flame = 0.5
smoke_seconds = 1.6
smoke_rise_px = 14.0

# The panel down the left: the original's `fortgump` art (a stone tile,
# the tall ruler with its dial, the Storm Power box), the crystal beside
# the figure, the icon size of the build list, the minimap's height and
# its colours.
[sidebar]
width = 280
art = "fortgump"
back_frame = 0
ruler_frame = 2
counter_frame = 4
crystal = "nugget"
icon_size = 48
minimap_height = 150
# A bridge piece in its slot, drawn with the bridge tiles: pixels per
# cell, and the list's text size.
piece_cell = 16
font_size = 14
colours = { sky = [0.16, 0.19, 0.33], sun = [0.35, 0.62, 0.25], thunder = [0.45, 0.45, 0.52], wind = [0.58, 0.45, 0.24], rain = [0.82, 0.86, 0.92], bridge = [0.62, 0.46, 0.24], mine = [0.2, 0.95, 0.2], enemy = [0.95, 0.2, 0.2], unit = [1.0, 1.0, 1.0], view = [1.0, 1.0, 0.6] }

[controls]
# Keys for the piece slots, as in the original Production window.
slot_keys = ["Q", "W", "A", "S", "Z", "X"]
# Buildings on the number keys.
build_tools = ["suncannon", "sunarcher", "sunbattery", "sunfactory", "treetwo", "windbattery", "outpost"]
# Units on letter keys: the Golem and the Balloon.
unit_keys = ["U", "I"]
unit_tools = ["sunwalker", "sunballoon"]
# Camera pan speed in source pixels per second, and the starting zoom.
pan_speed = 120.0
zoom = 4.0
# Frames per second of sprite animation.
animation_fps = 10.0
# Seconds after start-up at which ISLEFALL_SCREENSHOT fires by default.
screenshot_seconds = 1.5
# Palette file stem from d/ used for all sprites (the game's fixed palette).
palette = "gifcloud"
# Log the world's hash this often in seconds (0 never): two runs of one
# replay must log the same hashes.
hash_every_seconds = 10.0
# F5 saves the world here (a binary snapshot) and F9 loads it.
save_file = "islefall.save"

[sounds]
# Directory of sound files inside the NetStorm installation.
dir = "sound"
# Master volume, 0.0 (silent) to 1.0; ISLEFALL_VOLUME overrides it.
volume = 0.6
# At most this many sounds start in one frame, so a big explosion does not stack.
max_per_frame = 4

# What each event plays. A type's `property` is consulted first when the
# event involves a type; `file` is the fallback. Omit both for silence.
[sounds.events]
fired = { property = "fireSound", file = "fireCrossbow.wav" }
hit = { property = "impactSound", file = "impact.wav" }
placed = { file = "apStart.wav" }
built = { property = "buildDoneSound", file = "buildDone.wav" }
destroyed = { file = "explosion.wav" }
salvaged = { file = "dissolve.wav" }
moved = { property = "moveSound", variants = true }
pickup = { property = "pickupSound", file = "priestPickUp.wav" }
sacrificed = { file = "priestSacrifice2.WAV" }
harvested = { file = "geyserMined1.WAV" }
# A Transport setting down its load: the type's own `dropSound`.
dropped = { property = "dropSound", file = "golemDrop.wav" }
piece_placed = { file = "dropPiece-500.wav" }
bridge_cracked = { file = "bridgecrack.wav" }
bridge_fell = { file = "bridgeFall.WAV" }
island_fell = { file = "islandFall.wav" }
unit_lost = { file = "unitLost.wav" }
launched = { property = "activeSound" }
floating = { file = "priestFall.wav" }
eliminated = { file = "itIsDone2.WAV" }
learned = { property = "activeSound" }
casting = { property = "fireSound" }
cast = {}
victory = { file = "70AriseMyChampions.wav" }

# Every sound fades with its distance from the camera centre and with the
# camera's height; the curve is `sound_gain` in scripts/rules.rhai. Objects
# outside the view are silent. A file name ending in "-500" carries its own
# base gain of -5 dB, as the original engine read it.
[sounds.attenuation]
# Zoom at which the camera's height costs nothing; each halving of the
# zoom (the camera rising) takes `db_per_halving` off.
reference_zoom = 4.0
db_per_halving = 6.0
# Decibels lost at the edge of the view, relative to its centre.
edge_db = -9.0
# Most object loops playing at once, nearest the centre first.
max_loops = 8
# Type property naming the loop an object plays while it stands or flies,
# and the loop a structure plays while its stream builds it.
loop_property = "activeSound"
building_loop = "apBuilding.wav"

# Walkers with step sounds step to their walk animation, `per_cycle` steps
# per cycle, cycling through the file's numbered siblings (bulfWalk1 to 5).
# A type's `moveSound` is its voice answering an order, played once by the
# `moved` event above, so only types listed here make a sound walking.
[sounds.footsteps]
per_cycle = 2
steps = { bulf = "bulfWalk1.WAV" }

# A bed that never stops, and sky noises at random intervals (seconds,
# least and most); both play at their base gain wherever the camera is.
[sounds.ambient]
bed = "distantWindQuiet-3000.wav"
sky = ["eagleScream-1500.wav", "whale.wav", "guy-1200.wav", "ThunderQuietDistant.wav"]
sky_seconds = [12.0, 45.0]

# The projectile type of each shooter. The type files hold fire and impact
# sounds on the projectile, but nothing in the data links the two, so the
# pairing is by name here. A shooter's own property still wins.
[sounds.projectiles]
sunarcher = "sundisc"
windarcher = "bolt"
thundercannon = "thundercannonmissile"
raincannon = "raincannonmissile"

# Names the type files use that have no file of their own: the file in the
# sound directory to play instead. Most differ only by a "-500" or "-1000"
# suffix on disk (a gain hint, by the look of it); thunderBattery is a guess.
[sounds.aliases]
"dustDevilSpin.wav" = "dustDevilSpin-500.wav"
"fireBow.wav" = "fireCrossbow.wav"
"iceCannonImpact.wav" = "icecannonimpact-500.wav"
"manOWarFire.wav" = "manOWarFire-500.wav"
"sailSkaterMove.wav" = "sailMove.wav"
"sunFenceImpact.wav" = "sunFenceImpact-500.wav"
"thunderBattery.wav" = "shortZap.wav"
"thunderCannon.wav" = "thunderCannon-1000.wav"

# Replace a sound file by name (case-insensitive) with your own, as a path
# relative to the data directory. Only WAV is decoded unless the app is
# built with more of Bevy's audio decoders.
[sounds.overrides]
# "explosion.wav" = "mods/boom.wav"

# The original's campaign scenarios (`ISLEFALL_MAP=<name>` for a `.fort`
# in netstorm.tarc, see docs/FORT.md). A scenario names its things by
# type codes that no shipped file explains; these were read off the
# missions' own texts (six Disc Throwers here, a Sun Barricade of four
# posts there) and are open to correction. An empty name skips a code.
[fort]
codes = { "47" = "sunarcher", "48" = "sunaviary", "4b" = "windbattery", "4c" = "rainbattery", "4d" = "thunderbattery", "4e" = "sunbattery", "4f" = "thunderblocker", "55" = "sunfactory", "56" = "windfactory", "57" = "rainfactory", "58" = "thunderfactory", "5e" = "", "6f" = "sunblocker", "80" = "suncannon", "81" = "rainblocker", "83" = "thundercannon", "85" = "outpost", "87" = "thunderfence", "88" = "sunfence", "89" = "windarcher", "8c" = "windballoon", "8d" = "windaviary", "8e" = "windblocker", "8f" = "treetwo", "92" = "rainfence", "93" = "rainaviary", "94" = "thunderarcher", "9c" = "raincannon" }
units = { "59" = "priest", "70" = "sunwalker", "8b" = "windwalker" }
# A ground cell's byte picks the island's look.
ground_themes = ["sun", "thunder", "wind", "rain", "sun"]
# Altar codes 7c and 7d went with the Rain and Thunder players; 7b with Sun and Wind.
altar_themes = { "7b" = "", "7c" = "rain", "7d" = "thunder" }
# The Temple each faction gets; the data has no Sun vortex, so the Sun's is the Residence.
temples = { sun = "residence", wind = "windvortex", rain = "rainvortex", thunder = "thundervortex" }
altar = "dais"
priest = "priest"
geyser = "geyser"
# The tutorials say the player's Temple is a Wind Temple.
human_theme = "wind"
# Fortresses stand on a ring this far outside the scenario's islands.
ring_margin = 28
start_power = 2000
ai_power = 5000
bridge_owner = 0

# Maps made up on the spot: `ISLEFALL_MAP=random` (or `random:<seed>`),
# `ISLEFALL_PLAYERS=n`. Fortresses sit on a ring round the middle, the
# first at the top, with geyser islands and bare islets between.
[generate]
players = 2
world = [256, 256]
fortress = [32, 48]
fill = 0.7
ring_radius = 60
geysers_per_player = 4
geyser_spacing = 6
geyser_theme = "sun"
islets = 3
islet = [12, 9]
themes = ["sun", "wind", "rain", "thunder"]
start_power = 2000
